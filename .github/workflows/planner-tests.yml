name: Planner sandbox tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, Asia/Almaty, Europe/Kaliningrad, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for f in js/*.js sw.js; do node --check "$f" || exit 1; done
          node --test tests/*.test.cjs
